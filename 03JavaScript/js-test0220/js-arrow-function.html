<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アロー関数の書き方</title>
  </head>
  <body>
    <script>
      // アロー関数の基本の形
      // 読み方：「引数を受け取って、矢印の先の処理を実行する」と読みます
      const multiply = (a, b) => {
        return a * b;
      };

      //うえと同じ関数定義
      function multiply_func(a, b) {
        return a * b;
      }

      // さらに短く書ける場合（処理が1行なら return も省けます）
      const multiplyShort = (a, b) => a * b;

      //関数を呼び出し == 実行

      // const result = multiply(3, 5);
      // const result = multiply_func(4, 8);

      // 関数の処理の結果を一旦変数にいれて、console.logに表示
      const result = multiplyShort(9, 6);
      console.log(result);

      // console.log()の中に関数を書いてしまえることもできる
      console.log(multiply(3, 5));
    </script>
  </body>
</html>
