<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>if文のサンプル</title>
  </head>
  <h1>if文の例文　結果はコンソールに</h1>
  <body>
    <script>
      /*
      if (条件式) {
        //条件に合っている時（true）に行う処理
      }
      */
      const height = 90; //好きな数字を入れ替えて試してみましょう

      // if(height高さのデータ 90以上)
      if (height >= 90) {
        alert('スプラッシュマウンテンに乗れます'); // 90cm以上
      } else {
        alert('90cm未満の方は搭乗できません');
      }
    </script>
  </body>
</html>
