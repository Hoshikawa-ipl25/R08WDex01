<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>論理和について</title>
  </head>
  <body>
    <script>
      // 年齢の変数の中の値をいろいろ変えて確認しましょう
      const age = 70;
      // どちらかの条件が満たされてればOKな時→ || で条件式をつなぐ
      if (age <= 12 || age >= 65) {
        alert('映画を1000円を見ることができます');
        console.log('割引料金が適用されました');
      } else {
        alert('映画の通常料金 1800円です');
      }
    </script>
  </body>
</html>
