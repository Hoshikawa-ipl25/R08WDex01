<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>while文</title>
  </head>
  <body>
    <script>
      let i = 3;
      while (i < 100) {
        console.log(i);
        i = i * 3;
      }
      console.log('100を超えました');
      console.log(i);
    </script>
  </body>
</html>
