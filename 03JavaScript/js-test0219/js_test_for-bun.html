<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>for文について</title>
  </head>
  <body>
    <script>
      //i++ は i=i+1 と同じ式。
      // for (let i = 0; i < 10; i++) {
      //   console.log(i + 1 + '回目のベル');
      //   //〇回目のベル、と10回表示される
      // }
      for (let i = 10; i >= 0; i--) {
        console.log('カウントダウン、' + i);
      }
      console.log('ドカーン');
    </script>
  </body>
</html>
