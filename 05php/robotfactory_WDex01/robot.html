<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>どんなロボットを作る？ - ロボットファクトリー</title>
    <link rel="stylesheet" href="css/style.css?v=2" />
  </head>
  <body>
    <div class="robot_detail">
      <h1><img src="img/title.svg" alt="どんなロボットを作る？" /></h1>
      <form action="create.php" method="post">
        <dl>
          <dt><label for="named">名前</label></dt>
          <dd><input type="text" name="robo_name" id="named" /></dd>

          <dt><label for="color">色</label></dt>
          <dd>
            <select name="robo_color" id="color">
              <option value="blue" selected>青</option>
              <option value="green">緑</option>
              <option value="orange">オレンジ</option>
              <option value="purple">紫</option>
              <option value="red">赤</option>
              <option value="yellow">黄色</option>
            </select>
          </dd>

          <dt>大きさ</dt>
          <dd class="radio_btn">
            <input type="radio" name="robo_size" id="small" value="s" checked />
            <label for="small">小さめ</label>
            <input type="radio" name="robo_size" id="middle" value="m" />
            <label for="middle">普通</label>
            <input type="radio" name="robo_size" id="large" value="l" />
            <label for="large">大きめ</label>
          </dd>

          <dt><label for="x">横の位置</label></dt>
          <dd><input type="text" name="robo_x" id="x" /></dd>

          <dt><label for="y">縦の位置</label></dt>
          <dd><input type="text" name="robo_y" id="y" /></dd>

          <dt><label for="angle">角度</label></dt>
          <dd><input type="text" name="robo_angle" id="angle" /></dd>
        </dl>
        <button>ロボットを作る</button>
      </form>
    </div>
  </body>
</html>
